[patch]
base_rom = patch_base.rom
analysis = patch_base.ini
checksum = keep

[op:mid_insn]
type = nop
at = Start+1

[op:wrong_expect]
type = bytes
at = Start+2
expect = 99
bytes = 12

[op:first]
type = bytes
at = 0x8005
expect = bd
bytes = 7e

[op:overlap]
type = bytes
at = Start+5
expect = bd
bytes = 7e

[op:unknown]
type = bytes
at = NoSuchLabel
bytes = 00

[op:off]
type = bytes
enabled = no
at = Start
bytes = 00

[op:too_big]
type = asm
at = Check
length = 2
code =
    | JSR Start

[op:foreign]
type = asm
at = Start+0x0e
expect = c6 01 39
code =
    | JMP PagedRoutine
