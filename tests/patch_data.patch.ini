; apexpatch data ops: a typed value, a longer string that shifts the strings
; behind it, a shorter one in place, one relocated to free space, and a data
; block moved to another bank behind a far pointer
[patch]
base_rom = patch_data.rom
analysis = patch_data.ini
checksum = keep

[op:lives]
type = value
at = Lives
vtype = TYPE_LIVES
value = nine

[op:greeting]
type = string
at = Str1
text = HELLO!!

[op:bye]
type = string
at = StrB
text = BY

[op:short]
type = string
at = StrC
mode = relocate
text = A MUCH LONGER TEXT

[op:data]
type = move
at = DataBlk
alloc = bank:31
