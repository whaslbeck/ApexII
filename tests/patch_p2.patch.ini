; apexpatch P2 test: a RAM variable, code allocated in free space (behind a
; reserved block), a detour hook, a far pointer to patch code
[patch]
base_rom = patch_base.rom
analysis = patch_base.ini
checksum = keep

[op:timer]
type = ram
at = 0x0100
label = BallSaveTimer

[op:keep_out]
type = reserve
at = 0x8012
length = 4

[op:routine]
type = asm
alloc = system
code =
    | MyRoutine:
    |     LDA #0x05
    |     STA BallSaveTimer
    |     RTS

[op:count_checks]
type = hook
at = Check
code =
    |     INC BallSaveTimer

[op:vector]
type = ptr
at = 0x9100
target = MyRoutine
expect = ff ff ff
