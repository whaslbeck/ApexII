; apexpatch asset-op errors
[patch]
base_rom = patch_dmd.rom
analysis = patch_dmd.ini
checksum = keep

[op:too_big]
type = dmd
at = FrameSmall
file = patch_dmd_a.pbm
mode = inplace

[op:not_image]
type = dmd
at = FrameRaw
file = patch_blob.bin

[op:wrong_size]
type = dmd
at = FrameRaw
file = patch_dmd_small.pgm

[op:no_frame]
type = dmd
at = Start
file = patch_dmd_a.pbm

[op:no_file]
type = blob
at = 0x8030
file = missing.bin
