; apexpatch assets: a 1-plane frame replaced in place, a frame that grows and
; is relocated behind its far pointer, a 2-plane frame from a 4-level image,
; and a binary blob allocated under a label
[patch]
base_rom = patch_dmd.rom
analysis = patch_dmd.ini
checksum = keep

[op:raw]
type = dmd
at = FrameRaw
file = patch_dmd_a.pbm

[op:small]
type = dmd
at = FrameSmall
file = patch_dmd_a.pbm

[op:two]
type = dmd
at = Frame2
file = patch_dmd_b.pgm

[op:blob]
type = blob
file = patch_blob.bin
alloc = bank:31
label = MyBlob

[op:blobptr]
type = ptr
at = 0x8020
target = MyBlob
expect = ff ff ff
