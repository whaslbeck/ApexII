[patch]
base_rom = patch_base.rom
analysis = patch_base.ini
checksum = keep

[op:pcrel]
type = hook
at = Start+0x08
code =
    | NOP

[op:nobank]
type = asm
alloc = bank:0x99
code =
    | RTS

[op:taken]
type = asm
alloc = bank:0x30
placed = B30_A4001
code =
    | RTS

[op:wrongbank]
type = hook
at = PagedRoutine
alloc = bank:0x31
code =
    | NOP

[op:ram_a]
type = ram
at = 0x0200
length = 2
label = VarA

[op:ram_b]
type = ram
at = 0x0201
label = VarB
