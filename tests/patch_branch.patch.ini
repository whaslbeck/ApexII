; apexpatch branch / redirect ops: invert a branch, send a call elsewhere
[patch]
base_rom = patch_base.rom
analysis = patch_base.ini
checksum = keep

[op:loop]
type = branch
at = Start+8
mode = invert

[op:call]
type = redirect
at = Start+5
target = Helper

[op:code]
type = asm
alloc = system
code =
    | MyHelper:
    |     RTS

[op:call2]
type = redirect
at = Start+0x0a
target = MyHelper
