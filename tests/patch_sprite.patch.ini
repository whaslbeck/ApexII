; apexpatch sprite ops: a mono sprite that grows and is relocated behind its
; pointer, a 4-level image into a 0xFF and a 0xFE sprite (the latter's second
; plane is rewritten behind its pointer), a wider no-header image
[patch]
base_rom = patch_sprite.rom
analysis = patch_sprite.ini
checksum = keep

[op:mono]
type = sprite
at = SprMono
file = patch_sprite_mono.pbm

[op:direct]
type = sprite
at = SprDirect
file = patch_sprite_4.pgm

[op:indirect]
type = sprite
at = SprIndirect
file = patch_sprite_4.pgm

[op:nohdr]
type = sprite
at = SprNoHdr
file = patch_sprite_nh.pbm
