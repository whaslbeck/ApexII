; apexpatch sprite-op errors
[patch]
base_rom = patch_sprite.rom
analysis = patch_sprite.ini
checksum = keep

[op:resize_fe]
type = sprite
at = SprIndirect
file = patch_sprite_mono.pbm

[op:height]
type = sprite
at = SprNoHdr
file = patch_sprite_mono.pbm

[op:not_sprite]
type = sprite
at = Start
file = patch_sprite_4.pgm
