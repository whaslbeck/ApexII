; apexpatch test: one op of each kind on out/patch_base.rom
[patch]
base_rom = patch_base.rom
analysis = patch_base.ini
checksum = keep

[op:longer]
type = bytes
at = Start+1
expect = 0a
bytes = 14

; NOP out the compare in Check
[op:skip_compare]
type = nop
at = Check+3
count = 1

[op:call_new]
type = asm
at = Start+0x0a
code =
    | JSR NewThing          ; replaces JSR Helper + its inline byte

[op:new_code]
type = asm
at = 0x9000
note = "new routine in free space; ; and \"quotes\" survive"
code =
    | NewThing:
    |     LDA #0x01
    |     JSR Check
    |     RTS
