; apexpatch rebase test: carried over to patch_base_v2.rom, where Check, Helper
; and PagedRoutine moved
[patch]
base_rom = patch_base.rom
analysis = patch_base.ini
checksum = keep

[op:check]
type = hook
at = Check
code =
    |     INC 0x0100

[op:paged]
type = bytes
at = PagedRoutine+1
expect = 05
bytes = 07

[op:store]
type = nop
at = Start+2
expect = b7 00 50

[op:helper_arg]
type = value
at = Start+0x0d
expect = 42
value = 0x43
