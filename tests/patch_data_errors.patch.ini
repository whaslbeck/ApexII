[patch]
base_rom = patch_data.rom
analysis = patch_data.ini
checksum = keep

[op:too_long]
type = string
at = StrB
mode = inplace
text = BYEBYE

[op:no_room]
type = string
at = StrB
mode = shift
text = GOODBYE

[op:far_away]
type = move
at = StrC
alloc = bank:30

[op:far_away_ok]
type = move
at = Lives
alloc = bank:30
accept = yes

[op:big]
type = value
at = Lives
value = 0x100

[op:farval]
type = value
at = FarTable
width = 3
value = 0x4001

[op:umlaut]
type = string
at = Str3
text = "äh"
