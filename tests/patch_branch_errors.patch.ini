; apexpatch branch / redirect errors
[patch]
base_rom = patch_base.rom
analysis = patch_base.ini
checksum = keep

[op:not_branch]
type = branch
at = Start

[op:bad_mode]
type = branch
at = Start+8
mode = sometimes

[op:too_far]
type = redirect
at = Start+8
target = Check

[op:other_bank]
type = redirect
at = Start+5
target = PagedRoutine

[op:no_jump]
type = redirect
at = Start+2
target = Helper
